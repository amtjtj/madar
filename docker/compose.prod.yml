# Production stack (ADR 0016). Run from the repo root through scripts/deploy/deploy.sh, which
# builds the images first. Reads the repo-root .env written by scripts/deploy/init-env.sh.
#   docker compose --env-file .env -f docker/compose.prod.yml up -d
name: madar

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# App containers may not gain privileges (setuid binaries); they run as `node`.
x-hardening: &hardening
  security_opt: ['no-new-privileges:true']

x-app-env: &app-env
  NODE_ENV: production
  APP_DATABASE_URL: ${APP_DATABASE_URL}
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_BASE_URL: https://${MADAR_DOMAIN}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
  TENANT_SIGNUP_CODE: ${TENANT_SIGNUP_CODE}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  PUSH_PROXY_URL: ${PUSH_PROXY_URL:-}
  DEMO_MODE: ${DEMO_MODE:-}
  SEED_PASSWORD: ${DEMO_PASSWORD:-}
  # Attachments (ADR 0019): the files-data volume by default, or an S3-compatible service.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_DIR: /data/files
  # Uploads in progress, on the same volume so the move into storage is a rename.
  UPLOAD_TMP_DIR: /data/files/.tmp
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  # The assistant (ADR 0025): empty unless the `ai` profile runs (http://ai:4200).
  AI_SERVICE_URL: ${AI_SERVICE_URL:-}
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
  TZ: Asia/Tehran

services:
  postgres:
    image: ${BASE_REGISTRY:-docker.io/library}/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-madar}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    logging: *logging

  redis:
    image: ${BASE_REGISTRY:-docker.io/library}/redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    logging: *logging

  # Applies migrations (and creates the app and worker roles) before api and worker start.
  migrate:
    image: madar-api:${MADAR_TAG:-latest}
    restart: 'no'
    command: ['node', 'node_modules/@madar/db/dist/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardening
    healthcheck:
      disable: true
    networks: [data]
    logging: *logging

  api:
    image: madar-api:${MADAR_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: '4000'
    volumes:
      - files-data:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    <<: *hardening
    # Reaches the database (data) and the AI service (ai), and is reached by Caddy (edge).
    networks: [data, edge, ai]
    logging: *logging

  worker:
    image: madar-api:${MADAR_TAG:-latest}
    restart: unless-stopped
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    environment: *app-env
    healthcheck:
      test: ['CMD', 'node', 'dist/scripts/healthcheck.js', 'worker']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - files-data:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    <<: *hardening
    networks: [data, ai]
    logging: *logging

  web:
    image: madar-web:${MADAR_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
    depends_on:
      api:
        condition: service_healthy
    <<: *hardening
    # The web server never talks to the database.
    networks: [edge]
    logging: *logging

  # Demo server only (COMPOSE_PROFILES=demo): resets the demo company every night.
  demo:
    image: madar-api:${MADAR_TAG:-latest}
    profiles: [demo]
    restart: unless-stopped
    command: ['node', 'dist/scripts/demo-reset.js', '--daily']
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL}
      DEMO_RESET_AT: ${DEMO_RESET_AT:-05:00}
    volumes:
      - files-data:/data/files
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *hardening
    networks: [data]
    logging: *logging

  # The assistant (ADR 0025, COMPOSE_PROFILES=ai): stateless, on the internal `ai` network only;
  # it reaches the model server and nothing else (no database, no internet).
  ai:
    image: madar-ai:${MADAR_TAG:-latest}
    profiles: [ai]
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-7b-instruct}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-85}
      TZ: Asia/Tehran
    <<: *hardening
    networks: [ai]
    logging: *logging

  # The model on CPU (COMPOSE_PROFILES=ai,llm-cpu): llama.cpp's OpenAI-compatible server with a
  # GGUF file downloaded once into ./models (docs/deploy.md, «دستیار»). Slow but needs no GPU.
  llm-cpu:
    image: ${LLM_CPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b5350}
    profiles: [llm-cpu]
    restart: unless-stopped
    command:
      - --model
      - /models/${LLM_MODEL_FILE:-qwen2.5-7b-instruct-q4_k_m.gguf}
      - --alias
      - ${LLM_MODEL:-qwen2.5-7b-instruct}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - '4096'
      - --threads
      - '${LLM_THREADS:-4}'
    volumes:
      - ../models:/models:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    <<: *hardening
    networks:
      ai:
        aliases: [llm]
    logging: *logging

  # The model on a GPU (COMPOSE_PROFILES=ai,llm-gpu): vLLM, weights in ./models.
  llm-gpu:
    image: ${LLM_GPU_IMAGE:-vllm/vllm-openai:v0.8.5}
    profiles: [llm-gpu]
    restart: unless-stopped
    command:
      - --model
      - /models/${LLM_MODEL_DIR:-Qwen2.5-7B-Instruct}
      - --served-model-name
      - ${LLM_MODEL:-qwen2.5-7b-instruct}
      - --port
      - '8080'
      - --max-model-len
      - '8192'
    environment:
      HF_HUB_OFFLINE: '1'
    volumes:
      - ../models:/models:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    <<: *hardening
    networks:
      ai:
        aliases: [llm]
    logging: *logging

  # Nightly pg_dump and attachments archive, with a restore check after every backup
  # (docker/backup/backup.sh).
  backup:
    image: ${BASE_REGISTRY:-docker.io/library}/postgres:18-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/backup.sh']
    command: ['loop']
    environment:
      TZ: Asia/Tehran
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-madar}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - ./backup/backup.sh:/scripts/backup.sh:ro
      - ../backups:/backups
      # Attachments go into the nightly backup too (restore.sh writes them back).
      - files-data:/files
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    logging: *logging

  caddy:
    image: ${BASE_REGISTRY:-docker.io/library}/caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      MADAR_DOMAIN: ${MADAR_DOMAIN}
      CADDY_TLS: ${CADDY_TLS:-}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]
    logging: *logging

networks:
  data:
  edge:
  # No way out: the assistant and the model never reach the internet.
  ai:
    internal: true

volumes:
  postgres-data:
  redis-data:
  files-data:
  caddy-data:
  caddy-config:
