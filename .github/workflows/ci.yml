name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://madar:madar_ci_password@localhost:5432/madar
  APP_DATABASE_URL: postgres://madar_app:madar_app_ci_password@localhost:5432/madar
  WORKER_DATABASE_URL: postgres://madar_worker:madar_worker_ci_password@localhost:5432/madar
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-only-auth-secret-not-for-production-use

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: madar
          POSTGRES_PASSWORD: madar_ci_password
          POSTGRES_DB: madar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U madar" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm turbo run typecheck lint test
      - run: pnpm --filter @madar/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
