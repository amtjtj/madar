name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://madar:madar_ci_password@localhost:5432/madar
  APP_DATABASE_URL: postgres://madar_app:madar_app_ci_password@localhost:5432/madar
  WORKER_DATABASE_URL: postgres://madar_worker:madar_worker_ci_password@localhost:5432/madar
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-only-auth-secret-not-for-production-use
  # CI-only Web Push key pair (never used anywhere else)
  VAPID_PUBLIC_KEY: BLji1C_nC2joUs9pVMay1Y1Ur5fwUaOj0bG2kZ2OiOKWPOLN7rEVeDQDRuot7SbA13nVJb6W7Lq9443GWwykDHA
  VAPID_PRIVATE_KEY: NllAo0kzFXa44kMqSomruq2D_RuObqQ2LMhUO-7LRYo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 18 with pgvector (ADR 0026); production builds the same version on Alpine.
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: madar
          POSTGRES_PASSWORD: madar_ci_password
          POSTGRES_DB: madar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U madar" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The AI service (apps/ai) runs its pytest, ruff and mypy through turbo like the rest.
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm turbo run typecheck lint test
      - run: pnpm --filter @madar/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The production stack (ADR 0016): build the images, deploy with the real scripts on a demo
  # configuration (local certificate), then smoke-test it over HTTPS and drill a restore.
  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madar/web exec playwright install --with-deps chromium
      - name: Production settings for a local demo stack
        run: |
          scripts/deploy/init-env.sh localhost ci@madar.test --demo
          sed -i 's|^CADDY_TLS=.*|CADDY_TLS=tls internal|' .env
          # The assistant's service in the real stack, with the fake model (no weights in CI).
          sed -i 's|^COMPOSE_PROFILES=demo|COMPOSE_PROFILES=demo,ai|; s|^AI_SERVICE_URL=.*|AI_SERVICE_URL=http://ai:4200|' .env
          echo 'LLM_PROVIDER=fake' >> .env
          sed -i 's|^AI_ASK_MAX_DISTANCE=.*|AI_ASK_MAX_DISTANCE=0.9|' .env
      - run: scripts/deploy/deploy.sh --no-pull
      - run: scripts/deploy/smoke.sh --restore
      - if: failure()
        run: docker compose --env-file .env -f docker/compose.prod.yml -p madar logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke
          # Traces only; never the saved demo sessions.
          path: |
            apps/web/test-results
            !apps/web/test-results/.smoke-auth
          retention-days: 7
